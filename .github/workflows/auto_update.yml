name: Auto Update Cloudflare IP

on:
  # 1. 设置定时任务（Cron 表达式）
  # 下面示例为每天北京时间 02:00 和 14:00 运行一次（注意 GitHub Actions 使用 UTC 时间，比北京时间慢 8 小时）
  schedule:
    - cron: '0 6,18 * * *'
  
  # 2. 允许手动触发
  workflow_dispatch:

jobs:
  update-ip:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 赋予写入仓库权限，以便自动提交更新后的 ip.txt

    steps:
    # 1. 检出代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. 运行主程序生成/更新 ip.txt
    - name: Run main.py
      run: |
        python main.py

    # 5. 自动提交并推送更新后的文件到仓库
    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add ip.txt
        # 检查是否有改动，有改动才提交
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update ip.txt via GitHub Actions [skip ci]" && git push)
